name: Refresh GitHub stats cards

# Self-generated, accurate stats + streak SVGs (Asia/Manila, private included).
# Replaces third-party demo instances that drift (no PAT, shared rate limits, UTC).
on:
  schedule:
    # 00:30 Asia/Manila == 16:30 UTC (previous day)
    - cron: "30 16 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/github_stats.py"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

concurrency:
  group: stats-cards
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate stats SVGs
        env:
          # PAT (classic) with `read:user` + `repo` scopes so private
          # contributions are counted. Create at
          # https://github.com/settings/tokens and save as repo secret
          # GH_STATS_TOKEN. Falls back to GITHUB_TOKEN (public-only).
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STATS_TZ: Asia/Manila
        run: python3 scripts/github_stats.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/streak.svg assets/stats.json
          git diff --cached --quiet || git commit -m "chore: refresh GitHub stats cards"
          git push
